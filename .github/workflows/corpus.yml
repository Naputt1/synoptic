name: Corpus

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    name: corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/package.json

      # The harness builds the analyzer, which embeds ui/dist/index.html.
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: Build UI
        working-directory: ui
        run: bun run build

      - name: Cache corpus clones
        uses: actions/cache@v4
        with:
          path: .corpus
          key: corpus-${{ hashFiles('testdata/corpus.json') }}
          restore-keys: |
            corpus-

      - name: Measure pinned repos
        run: go test -tags corpus -run '^TestCorpus$' -v .

      - name: Upload corpus table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: .corpus/report.txt
          if-no-files-found: warn
          retention-days: 7
